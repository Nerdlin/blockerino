name: "💡 Idea · Предложить идею"
description: Suggest a feature or an improvement · Предложить новую функцию или улучшение
title: "[Idea]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ## 🚀 Got an idea? · Есть идея?
        Tell us what you would like to see in Blockerino. Ideas that many players like move up the list.
        Расскажи, что хотел бы видеть в Blockerino. Идеи, которые нравятся многим, поднимаются выше в списке.
  - type: textarea
    id: idea
    attributes:
      label: "✨ What would you like to see? · Что хотелось бы увидеть?"
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: "🎯 Why is it useful? · Чем это полезно?"
      description: "Which problem does it solve, or what would make the game more fun? · Какую проблему решает или что сделает игру интереснее?"
  - type: dropdown
    id: area
    attributes:
      label: "🧭 Which part of the game? · К какой части игры относится?"
      options:
        - Classic / Chaos
        - Versus 1v1
        - More Games (chess, Sea Battle, Durak…)
        - Friends and profiles
        - Shop and coins
        - Something else · Другое
