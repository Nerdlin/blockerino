plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.installsource'
version = '1.0.0'

android {
  namespace "expo.modules.installsource"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // Google Play in-app updates: the "Update available" window for installs from Play
  implementation "com.google.android.play:app-update:2.1.0"
}
