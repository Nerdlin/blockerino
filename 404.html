<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blockerino - 404</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #050510;
        --panel: rgba(8, 10, 20, 0.86);
        --line: rgba(255, 255, 255, 0.24);
        --red: #ff335a;
        --cyan: #00ffcc;
        --gold: #ffd700;
        --text: #ffffff;
        --muted: rgba(255, 255, 255, 0.68);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        background:
          linear-gradient(135deg, rgba(255, 51, 90, 0.16), transparent 28%),
          linear-gradient(225deg, rgba(0, 255, 204, 0.14), transparent 32%),
          var(--bg);
        color: var(--text);
        font-family: "Silkscreen", "Courier New", monospace;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      .scanlines {
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.16;
        background-image: repeating-linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.18) 0,
          rgba(255, 255, 255, 0.18) 1px,
          transparent 1px,
          transparent 7px
        );
      }

      main {
        width: min(760px, calc(100vw - 32px));
        border: 2px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: 0 24px 90px rgba(0, 0, 0, 0.58), inset 0 0 0 1px rgba(255, 255, 255, 0.06);
        padding: clamp(24px, 6vw, 54px);
        text-align: center;
        position: relative;
      }

      .blocks {
        display: grid;
        grid-template-columns: repeat(7, 18px);
        grid-auto-rows: 18px;
        gap: 5px;
        width: max-content;
        margin: 0 auto 28px;
      }

      .block {
        width: 18px;
        height: 18px;
        border: 2px solid rgba(255, 255, 255, 0.34);
        background: var(--cyan);
      }

      .block.red { background: var(--red); }
      .block.gold { background: var(--gold); }
      .block.empty {
        background: transparent;
        border-color: rgba(255, 255, 255, 0.18);
      }

      h1 {
        margin: 0;
        font-size: clamp(56px, 14vw, 116px);
        line-height: 0.92;
        letter-spacing: 0;
        text-shadow: 5px 5px 0 rgba(255, 51, 90, 0.55), -4px -4px 0 rgba(0, 255, 204, 0.32);
      }

      p {
        max-width: 560px;
        margin: 18px auto 0;
        color: var(--muted);
        font-size: clamp(13px, 2.6vw, 18px);
        line-height: 1.55;
      }

      a {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        min-width: 210px;
        min-height: 48px;
        margin-top: 30px;
        padding: 12px 18px;
        border: 2px solid rgba(255, 255, 255, 0.4);
        border-radius: 8px;
        background: var(--red);
        color: #050510;
        text-decoration: none;
        font-size: 16px;
        font-weight: 700;
        box-shadow: 0 8px 0 rgba(0, 0, 0, 0.42);
      }

      a:focus-visible {
        outline: 3px solid var(--gold);
        outline-offset: 4px;
      }

      @media (max-width: 520px) {
        main {
          padding: 24px 18px 30px;
        }

        .blocks {
          grid-template-columns: repeat(7, 14px);
          grid-auto-rows: 14px;
          gap: 4px;
        }

        .block {
          width: 14px;
          height: 14px;
        }

        a {
          width: 100%;
          min-width: 0;
          font-size: 14px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="blocks" aria-hidden="true">
        <span class="block red"></span><span class="block red"></span><span class="block red"></span><span class="block empty"></span><span class="block"></span><span class="block"></span><span class="block"></span>
        <span class="block red"></span><span class="block empty"></span><span class="block red"></span><span class="block empty"></span><span class="block"></span><span class="block empty"></span><span class="block"></span>
        <span class="block red"></span><span class="block red"></span><span class="block red"></span><span class="block empty"></span><span class="block"></span><span class="block gold"></span><span class="block"></span>
      </div>
      <h1>404</h1>
      <p>This route fell outside the board. Head back to Blockerino and keep the combo alive.</p>
      <a href="/blockerino/">Back to game</a>
    </main>
    <div class="scanlines"></div>
  </body>
</html>
