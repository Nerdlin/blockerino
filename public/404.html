<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blockerino - 404</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
    <style>
      :root {
        color-scheme: dark;
        --bg: #050510;
        --panel: #0b0b16;
        --line: rgba(255, 255, 255, 0.18);
        --red: #ff3333;
        --violet: #7c3aed;
        --sky: #1fa4e0;
        --gold: #ffd700;
        --text: #ffffff;
        --muted: #9aa3b5;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        width: 100%;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: "Silkscreen", monospace, sans-serif;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: relative;
      }

      /* Blocks drifting down behind the card, like the game's menu background. */
      .rain { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
      .rain i {
        position: absolute;
        top: -40px;
        width: 22px;
        height: 22px;
        border: 3px solid rgba(255, 255, 255, 0.22);
        opacity: 0.35;
        animation: fall linear infinite;
      }
      @keyframes fall { to { transform: translateY(calc(100vh + 80px)); } }

      main {
        width: min(460px, calc(100vw - 32px));
        border: 1.5px solid var(--line);
        border-radius: 14px;
        background: var(--panel);
        padding: 28px 22px 26px;
        text-align: center;
        position: relative;
        z-index: 1;
      }

      .logo {
        width: 64px;
        height: 64px;
        border-radius: 14px;
        display: block;
        margin: 0 auto 18px;
      }

      .digits {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-bottom: 16px;
      }

      .digit {
        width: 84px;
        height: 96px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 58px;
        font-weight: 700;
        color: #fff;
      }
      .digit.red { background: var(--red); }
      .digit.violet { background: var(--violet); }
      .digit.sky { background: var(--sky); }

      h2 {
        font-size: 15px;
        color: var(--gold);
        margin-bottom: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      p {
        max-width: 360px;
        margin: 0 auto 22px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.7;
      }

      .btn {
        display: block;
        width: 100%;
        padding: 14px 16px;
        border: 2px solid rgba(255, 255, 255, 0.35);
        border-radius: 8px;
        background: var(--red);
        color: #fff;
        text-decoration: none;
        font-family: "Silkscreen", monospace;
        font-size: 14px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: opacity 0.15s ease;
      }
      .btn:hover { opacity: 0.85; }
      .btn:active { opacity: 0.7; }

      @media (max-width: 380px) {
        .digit { width: 64px; height: 76px; font-size: 44px; }
      }
    </style>
  </head>
  <body>
    <div class="rain" aria-hidden="true" id="rain"></div>
    <main>
      <img class="logo" src="/icon.png" alt="Blockerino" />
      <div class="digits" aria-label="404">
        <span class="digit red">4</span>
        <span class="digit violet">0</span>
        <span class="digit sky">4</span>
      </div>
      <h2>OUT OF BOUNDS / ВНЕ ПОЛЯ</h2>
      <p>Эта страница улетела за пределы игрового поля. Вернитесь в Blockerino и продолжайте игру!</p>
      <a href="/" id="backBtn" class="btn">В игру / Back to game</a>
    </main>

    <script>
      // Always go back to the root of the app, whatever the domain is.
      document.getElementById('backBtn').addEventListener('click', function (e) {
        e.preventDefault();
        window.location.href = window.location.origin + '/';
      });

      // A handful of falling blocks in the game's colours.
      (function () {
        var colors = ['#ff3333', '#7c3aed', '#1fa4e0', '#ffd700', '#22c55e'];
        var rain = document.getElementById('rain');
        for (var i = 0; i < 14; i++) {
          var block = document.createElement('i');
          block.style.left = Math.round(Math.random() * 96) + '%';
          block.style.background = colors[i % colors.length];
          block.style.animationDuration = (9 + Math.random() * 10).toFixed(1) + 's';
          block.style.animationDelay = (-Math.random() * 18).toFixed(1) + 's';
          rain.appendChild(block);
        }
      })();
    </script>
  </body>
</html>
